<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Range preview</title>
  <style>
    :root {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      color: #111;
      background: #d8d8d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px;
      background:
        linear-gradient(135deg, #c8ccd0 25%, transparent 25%) 0 0 / 80px 80px,
        linear-gradient(315deg, #b9bdc2 25%, #e9e9e9 25%) 0 0 / 80px 80px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 18px;
      letter-spacing: .08em;
    }

    .preview-stack {
      display: grid;
      gap: 32px;
      max-width: 860px;
    }

    .window {
      overflow: hidden;
      border: 1.5px solid #111;
      background: rgba(255, 255, 255, .84);
      box-shadow: 8px 8px 0 #111;
    }

    .window__body {
      height: 74px;
      border-bottom: 1.5px solid #111;
      background: rgba(255, 255, 255, .42);
    }

    .opacity-row {
      display: flex;
      height: 54px;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-top: 1.5px solid #111;
    }

    .opacity-label {
      flex: none;
      font-size: 15px;
      letter-spacing: .1em;
    }

    .opacity-value {
      width: 44px;
      flex: none;
      font-size: 15px;
      text-align: right;
    }

    .range {
      position: relative;
      height: 10px;
      flex: 1;
      border: 1.5px solid #111;
      background: #fff;
    }

    .range__fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: #111;
    }

    .range__thumb {
      position: absolute;
      top: 0;
      width: 16px;
      height: 100%;
      transform: translateX(-50%);
      background: #111;
    }

    .range--82 .range__fill {
      width: 72%;
    }

    .range--82 .range__thumb {
      left: 72%;
    }

    .range--70 .range__fill {
      width: 54%;
    }

    .range--70 .range__thumb {
      left: 54%;
    }

    .context-menu {
      width: 420px;
      margin-left: 64px;
      background: #fff;
    }

    .context-menu .opacity-row {
      height: 62px;
      padding: 0 14px;
    }

    .context-menu .opacity-label,
    .context-menu .opacity-value {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>CUSTOM RANGE PREVIEW</h1>
  <div class="preview-stack">
    <section class="window">
      <div class="window__body"></div>
      <div class="opacity-row">
        <span class="opacity-label">OPACITY</span>
        <span class="range range--82" aria-hidden="true">
          <span class="range__fill"></span>
          <span class="range__thumb"></span>
        </span>
        <span class="opacity-value">82%</span>
      </div>
    </section>

    <section class="window context-menu">
      <div class="window__body"></div>
      <div class="opacity-row">
        <span class="opacity-label">OPACITY</span>
        <span class="range range--70" aria-hidden="true">
          <span class="range__fill"></span>
          <span class="range__thumb"></span>
        </span>
        <span class="opacity-value">70</span>
      </div>
    </section>
  </div>
</body>
</html>
